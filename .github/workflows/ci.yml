name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - name: Test suites, against the source and the minified build
        run: ./test.sh
      - name: Built artifacts match their source
        run: ./check-build-fresh.sh
